<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header>
      <h1>Internship Hunt</h1>
      <button id="check" type="button">Check now</button>
    </header>

    <p id="status" class="status">Loading…</p>
    <p id="inbox" class="status" hidden></p>

    <section id="autofill" class="autofill" hidden>
      <button id="fill" type="button">Fill this application</button>
      <p id="fillResult" class="meta"></p>
      <label id="variantRow" class="meta" hidden>
        Résumé sent
        <select id="resumeVariant">
          <option value="">Not recorded</option>
        </select>
      </label>
      <button id="track" type="button" hidden>Track this application</button>
      <p id="trackResult" class="meta"></p>

      <button id="answers" type="button">Answers for this form</button>
      <div id="answerList" class="answers"></div>
      <button id="saveAnswers" type="button" hidden>Save my answers from this form</button>
      <p id="answerResult" class="meta"></p>
    </section>

    <ul id="events" class="events"></ul>
    <p id="empty" class="empty" hidden>No alerts yet.</p>

    <footer>
      <a id="options" href="#">Settings</a>
      <a id="site" href="#" target="_blank" rel="noreferrer">Open the site</a>
    </footer>

    <script src="popup.js"></script>
  </body>
</html>
