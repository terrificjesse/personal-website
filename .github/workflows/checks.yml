# CI: the test suite, the lints, and 13f's classifier regression gate.
#
# The gate is the reason this file exists. `cargo test` catches a rule that stops compiling or
# stops satisfying its own unit test; it does not catch a rule that still passes every test and
# now files interview invitations under `disregarded`. That is what `labelset gate` is for, and
# what makes it a separate step here rather than one more test: its failure has to read as
# "the classifier changed behaviour", not as "a test broke".
#
# The gate itself needs no database and no secrets — the fixture, its company list and the
# baseline are all compiled into the binary. That is deliberate: a gate that needs the live
# database cannot run in CI, and a gate that reads its fixture off disk can be pointed at a
# different one.
#
# **Running it is not the same as the gate itself, and the difference has bitten this repo.**
# `main.rs` initialises the pool and applies all migrations before it dispatches any
# subcommand, so `cargo run -- labelset gate` creates and migrates a SQLite file whatever the
# gate then does with it. In CI that is ephemeral and harmless. Locally it is the 12n trap:
# `DATABASE_URL` defaults to a RELATIVE `sqlite://fridge.db?mode=rwc`, so running this from the
# repo root creates an empty database there rather than reading the real one. Run it from
# `apps/fridge-app/backend/`, which is what `working-directory` below pins.

name: checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/fridge-app/backend
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/fridge-app/backend
      - run: cargo test
      - run: cargo clippy --all-targets

      # 13f. Fails if any failure mode got worse than data/inbox/regression-baseline.json.
      # SYNTHETIC fixture — see docs/HUNT.md. A green result here says the rules still do what
      # they did to twelve invented strings. It is not a quality signal about real mail.
      - name: classifier regression gate
        run: cargo run --quiet -- labelset gate

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx eslint src --max-warnings=0
