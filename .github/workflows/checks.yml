# CI: the test suite, the lints, and 13f's classifier regression gate.
#
# The gate is the reason this file exists. `cargo test` catches a rule that stops compiling or
# stops satisfying its own unit test; it does not catch a rule that still passes every test and
# now files interview invitations under `disregarded`. That is what `labelset gate` is for, and
# what makes it a separate step here rather than one more test: its failure has to read as
# "the classifier changed behaviour", not as "a test broke".
#
# The gate needs NO DATABASE and no secrets — the fixture, its company list and the baseline are
# all compiled into the binary. That is deliberate: a gate that needs the live database cannot
# run in CI, and a gate that reads its fixture off disk can be pointed at a different one.

name: checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/fridge-app/backend
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/fridge-app/backend
      - run: cargo test
      - run: cargo clippy --all-targets

      # 13f. Fails if any failure mode got worse than data/inbox/regression-baseline.json.
      # SYNTHETIC fixture — see docs/HUNT.md. A green result here says the rules still do what
      # they did to twelve invented strings. It is not a quality signal about real mail.
      - name: classifier regression gate
        run: cargo run --quiet -- labelset gate

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx eslint src --max-warnings=0
